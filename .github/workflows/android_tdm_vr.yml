# Builds only The Dark Mod for arm64-v8a (the Quest 3 target), publishes the APK
# as a workflow artifact and updates a stable GitHub Release download.
#
# Triggers:
#   - push to the VR work branch, but ONLY when the head commit message contains "[apk]"
#     (so ordinary pushes do not spend CI minutes)
#   - manual "Run workflow" (needs this file to exist on the default branch)
#
# Simple phone download: Releases -> Quest 3 - Foveation Verification.
# APK filename: TDM-Quest3-Foveation-Verification.apk (also inside the Actions artifact).

name: Android APK - TDM only (arm64)

on:
  push:
    branches: [ "ccr-f26da023-1l9zer" ]
  workflow_dispatch:

permissions:
  contents: write  # allows gh release to publish the APK

concurrency:
  group: tdm-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
        df -h /

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: temurin
        cache: gradle

    - name: Accept Android SDK licenses
      run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: Build APK (TDM only, arm64-v8a)
      run: |
        python3 bin/pack_tdm_shaders.py --check
        python3 tests/renderer/shader_install_test.py
        python3 tests/renderer/shader_preprocess_test.py
        python3 tests/renderer/multiview_program_test.py
        python3 tests/renderer/gles_loader_test.py
        python3 tests/renderer/fog_policy_test.py
        python3 tests/renderer/mobile_batch_test.py
        python3 tests/renderer/mobile_submission_test.py
        python3 tests/renderer/mobile_multiview_commands_test.py
        g++ -std=c++14 -O2 -I Q3E/src/main/jni/darkmod tests/renderer/mobile_shadow_cache_test.cpp -o /tmp/quest-shadow-cache-test
        /tmp/quest-shadow-cache-test
        chmod +x ./gradlew
        # every game except The Dark Mod is switched off so only TDM's native library is compiled
        OFF="-DGAME_DOOM3=OFF,-DGAME_RTCW=OFF,-DGAME_QUAKE3=OFF,-DGAME_QUAKE2=OFF,-DGAME_QUAKE1=OFF"
        OFF="$OFF,-DGAME_DOOM3BFG=OFF,-DGAME_DOOM=OFF,-DGAME_ETW=OFF,-DGAME_REALRTCW=OFF,-DGAME_JK=OFF"
        OFF="$OFF,-DGAME_FTEQW=OFF,-DGAME_URT=OFF,-DGAME_OPENMOHAA=OFF,-DGAME_WOLF3D=OFF,-DGAME_SKINDEEP=OFF"
        OFF="$OFF,-DGAME_QC=OFF,-DGAME_ICARUS=OFF,-DGAME_SERIOUSSAM=OFF,-DGAME_XASH3D=OFF,-DGAME_SOURCE=OFF"
        ./gradlew assembleRelease -Pabifilters=arm64-v8a "-Pcmake_options=$OFF" --no-daemon --stacktrace
        df -h /

    - name: Collect APK
      run: |
        mkdir -p out
        cp idTech4Amm/build/outputs/apk/release/idTech4Amm-release.apk "out/TDM-Quest3-Foveation-Verification.apk"
        ls -la out

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quest3-Foveation-Verification-APK
        path: out/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Publish easy-download Quest APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag=quest-foveation-verification
        apk=out/TDM-Quest3-Foveation-Verification.apk
        notes="Quest 3 ARM64: includes the Bandwidth and Lighting Update plus a one-time GPU shading-rate probe and clearer foveation diagnostics. Enable Show renderer diagnostics overlay in launcher settings. The HUD shows the requested foveation level, coarse/total scene draw requests and the GPU result of a single-sample 2x2-rate startup test. A 1x1 result means the probe was rendered at full rate; unverified means the shader interface could not be measured. This does not measure per-fragment rates in the game or guarantee FPS gains. The conservative draw path retains full rate for any geometry crossing the protected centre; spatial-map drivers show map passes instead. No files are exported by the check. Eye resolution, tracking and controls are unchanged. Android ARM64 and production-controller/GLES state-restoration checks pass. Source commit: ${GITHUB_SHA} (branch ${GITHUB_REF_NAME})."
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release upload "$tag" "$apk" --clobber
          gh release edit "$tag" --title "Quest 3 - Foveation Verification" --notes "$notes" --latest
        else
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Quest 3 - Foveation Verification" --notes "$notes" --latest
        fi
