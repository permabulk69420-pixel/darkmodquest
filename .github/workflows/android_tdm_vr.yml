# Builds only The Dark Mod for arm64-v8a (the Quest 3 target) and publishes the APK as a workflow artifact.
#
# Triggers:
#   - push to the VR work branch, but ONLY when the head commit message contains "[apk]"
#     (so ordinary pushes do not spend CI minutes)
#   - manual "Run workflow" (needs this file to exist on the default branch)
#
# Download the APK from the run page: Actions -> this workflow -> the run -> Artifacts.

name: Android APK - TDM only (arm64)

on:
  push:
    branches: [ "ccr-f26da023-1l9zer" ]
  workflow_dispatch:

concurrency:
  group: tdm-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
        df -h /

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: temurin
        cache: gradle

    - name: Accept Android SDK licenses
      run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: Build APK (TDM only, arm64-v8a)
      run: |
        chmod +x ./gradlew
        # every game except The Dark Mod is switched off so only TDM's native library is compiled
        OFF="-DGAME_DOOM3=OFF,-DGAME_RTCW=OFF,-DGAME_QUAKE3=OFF,-DGAME_QUAKE2=OFF,-DGAME_QUAKE1=OFF"
        OFF="$OFF,-DGAME_DOOM3BFG=OFF,-DGAME_DOOM=OFF,-DGAME_ETW=OFF,-DGAME_REALRTCW=OFF,-DGAME_JK=OFF"
        OFF="$OFF,-DGAME_FTEQW=OFF,-DGAME_URT=OFF,-DGAME_OPENMOHAA=OFF,-DGAME_WOLF3D=OFF,-DGAME_SKINDEEP=OFF"
        OFF="$OFF,-DGAME_QC=OFF,-DGAME_ICARUS=OFF,-DGAME_SERIOUSSAM=OFF,-DGAME_XASH3D=OFF,-DGAME_SOURCE=OFF"
        ./gradlew assembleRelease -Pabifilters=arm64-v8a "-Pcmake_options=$OFF" --no-daemon --stacktrace
        df -h /

    - name: Collect APK
      run: |
        mkdir -p out
        cp idTech4Amm/build/outputs/apk/release/idTech4Amm-release.apk "out/TDM-quest-${GITHUB_SHA::7}-arm64.apk"
        ls -la out

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: tdm-quest-apk-${{ github.sha }}
        path: out/*.apk
        if-no-files-found: error
        retention-days: 30
