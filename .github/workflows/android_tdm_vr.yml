# Builds only The Dark Mod for arm64-v8a (the Quest 3 target), publishes the APK
# as a workflow artifact and updates a stable GitHub Release download.
#
# Triggers:
#   - push to the VR work branch, but ONLY when the head commit message contains "[apk]"
#     (so ordinary pushes do not spend CI minutes)
#   - manual "Run workflow" (needs this file to exist on the default branch)
#
# Simple phone download: Releases -> Quest 3 - Streaming and Shadow Update.
# APK filename: TDM-Quest3-Streaming-and-Shadows.apk (also inside the Actions artifact).

name: Android APK - TDM only (arm64)

on:
  push:
    branches: [ "ccr-f26da023-1l9zer" ]
  workflow_dispatch:

permissions:
  contents: write  # allows gh release to publish the APK

concurrency:
  group: tdm-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
        df -h /

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: temurin
        cache: gradle

    - name: Accept Android SDK licenses
      run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: Verify SpaceWarp on software GLES
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgles2 libgles-dev libgl1-mesa-dri
        # Use the same pinned OpenXR AAR as the APK without waiting for Gradle.
        python3 - <<'PY'
        import hashlib, os, pathlib, urllib.request, zipfile, io
        url = 'https://repo.maven.apache.org/maven2/org/khronos/openxr/openxr_loader_for_android/1.0.34/openxr_loader_for_android-1.0.34.aar'
        data = urllib.request.urlopen(url, timeout=60).read()
        assert hashlib.sha256(data).hexdigest() == 'c8b50603ad3b81756c6bd203ab9c9d19341326e14f6cbae87ee894137ee5e256'
        target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'quest-openxr-headers'
        with zipfile.ZipFile(io.BytesIO(data)) as archive:
            for name in archive.namelist():
                prefix = 'prefab/modules/headers/include/'
                if name.startswith(prefix) and not name.endswith('/'):
                    relative = pathlib.Path(name[len(prefix):])
                    assert '..' not in relative.parts
                    file = target / relative
                    file.parent.mkdir(parents=True, exist_ok=True)
                    file.write_bytes(archive.read(name))
        with open(os.environ['GITHUB_ENV'], 'a') as env:
            env.write('TDM_OPENXR_HEADERS=' + str(target) + '\n')
        PY
        export TDM_OPENXR_HEADERS="$RUNNER_TEMP/quest-openxr-headers"
        python3 tests/renderer/frame_timing_test.py
        python3 tests/renderer/spacewarp_gles_test.py
        python3 tests/renderer/mobile_shadow_batch_test.py
        python3 tests/renderer/mobile_gles_test.py MobileShaderTests.test_blocked_light_rejection_matches_full_brdf

    - name: Build APK (TDM only, arm64-v8a)
      run: |
        python3 bin/pack_tdm_shaders.py --check
        python3 tests/renderer/shader_install_test.py
        python3 tests/renderer/vr_settings_test.py
        python3 tests/renderer/frame_alloc_test.py
        python3 tests/renderer/spacewarp_buffer_test.py
        python3 tests/renderer/shader_preprocess_test.py
        python3 tests/renderer/multiview_program_test.py
        python3 tests/renderer/gles_loader_test.py
        python3 tests/renderer/fog_policy_test.py
        python3 tests/renderer/mobile_batch_test.py
        python3 tests/renderer/mobile_submission_test.py
        python3 tests/renderer/mobile_multiview_commands_test.py
        g++ -std=c++14 -O2 -I Q3E/src/main/jni/darkmod tests/renderer/mobile_shadow_cache_test.cpp -o /tmp/quest-shadow-cache-test
        /tmp/quest-shadow-cache-test
        chmod +x ./gradlew
        # every game except The Dark Mod is switched off so only TDM's native library is compiled
        OFF="-DGAME_DOOM3=OFF,-DGAME_RTCW=OFF,-DGAME_QUAKE3=OFF,-DGAME_QUAKE2=OFF,-DGAME_QUAKE1=OFF"
        OFF="$OFF,-DGAME_DOOM3BFG=OFF,-DGAME_DOOM=OFF,-DGAME_ETW=OFF,-DGAME_REALRTCW=OFF,-DGAME_JK=OFF"
        OFF="$OFF,-DGAME_FTEQW=OFF,-DGAME_URT=OFF,-DGAME_OPENMOHAA=OFF,-DGAME_WOLF3D=OFF,-DGAME_SKINDEEP=OFF"
        OFF="$OFF,-DGAME_QC=OFF,-DGAME_ICARUS=OFF,-DGAME_SERIOUSSAM=OFF,-DGAME_XASH3D=OFF,-DGAME_SOURCE=OFF"
        ./gradlew assembleRelease -Pabifilters=arm64-v8a "-Pcmake_options=$OFF" --no-daemon --stacktrace
        df -h /

    - name: Collect APK
      run: |
        mkdir -p out
        cp idTech4Amm/build/outputs/apk/release/idTech4Amm-release.apk "out/TDM-Quest3-Streaming-and-Shadows.apk"
        ls -la out

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quest3-Streaming-and-Shadows-APK
        path: out/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Publish easy-download Quest APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag=quest-streaming-and-shadows
        apk=out/TDM-Quest3-Streaming-and-Shadows.apk
        notes="Separates in-flight dynamic geometry into distinct GPU buffer objects on Quest's nonpersistent path, removing the shared-object upload/read dependency that can serialize CPU uploads with GPU rendering. Keeps the same total buffer capacity, existing reuse fences and four-frame SpaceWarp vertex history. Ordinary draws and SpaceWarp resolve frame-local buffer objects and offsets, including previous animated vertices. Also merges compatible static opaque shadow meshes into cached indexed draws and rejects fully shadowed non-parallax direct-light BRDF calculations. Original geometry, shadow resolution, single depth atlas, gameplay and eye resolution are preserved. No GPU readback or added depth copies. Separate launcher switches control streaming buffers, shadow batching and blocked-light rejection. Existing diagnostics show actual buffer mode, shadow submission reductions and eligible lighting draws. Shader patch 15 installs automatically. Android ARM64 build, production delayed-GPU lifetime/dependency tests, real GLES index-ring/depth comparisons and isolated-buffer SpaceWarp motion/depth checks, lighting image comparisons across all light capacities, launcher and stereo checks passed. The dependency model and software-driver ABBA timings verify mechanisms and workload behavior, not a measured Quest FPS improvement. All previous multiview, SpaceWarp, foveation and frame-timing changes are included. Source commit: ${GITHUB_SHA} (branch ${GITHUB_REF_NAME})."
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release upload "$tag" "$apk" --clobber
          gh release edit "$tag" --title "Quest 3 - Streaming and Shadow Update" --notes "$notes" --latest
        else
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Quest 3 - Streaming and Shadow Update" --notes "$notes" --latest
        fi
